services:
  slopkeeper:
    build: .
    container_name: slopkeeper
    restart: unless-stopped
    init: true
    env_file: .env
    volumes:
      - slopkeeper-data:/data
    deploy:
      resources:
        limits:
          memory: 256M

  voice:
    image: ghcr.io/chuck-amuck/slopkeeper-voice:latest # text to speech, optional. Needs VOICE_URL=http://voice:5000 in .env
    restart: unless-stopped
    init: true
    volumes:
      - slopkeeper-voice:/voices
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  slopkeeper-data:
  slopkeeper-voice:
