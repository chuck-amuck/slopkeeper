services:
  slopkeeper:
    build: .
    container_name: slopkeeper
    restart: unless-stopped
    init: true
    env_file: .env
    volumes:
      - slopkeeper-data:/data
    deploy:
      resources:
        limits:
          memory: 256M

  voice:
    image: ghcr.io/chuck-amuck/slopkeeper-voice:latest # text to speech, optional. Needs VOICE_URL=http://voice:5000 in .env
    restart: unless-stopped
    init: true
    volumes:
      - slopkeeper-voice:/voices
    deploy:
      resources:
        limits:
          memory: 512M

  music:
    image: ghcr.io/chuck-amuck/slopkeeper-music:latest # Spotify, optional. See the README's music container section
    restart: unless-stopped
    init: true
    environment:
      MUSIC_TOKEN: ${MUSIC_TOKEN}
      SOLOIST_API_KEY: ${SOLOIST_API_KEY}
      SOLOIST_ACCEPT_TERMS: ${SOLOIST_ACCEPT_TERMS}
      SOLOIST_SESSION: ${SOLOIST_SESSION}
    volumes:
      - slopkeeper-music:/data
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  slopkeeper-data:
  slopkeeper-voice:
  slopkeeper-music:
