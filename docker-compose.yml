services:
  slopkeeper:
    build: .
    container_name: slopkeeper
    restart: unless-stopped
    init: true
    env_file: .env
    volumes:
      - slopkeeper-data:/data
      - slopkeeper-music:/music:ro # the music container's downloaded songs
    deploy:
      resources:
        limits:
          memory: 256M

  web:
    image: ghcr.io/chuck-amuck/slopkeeper-web:latest # the web UI, optional. Needs API_TOKEN in .env, which also turns the bot's API on
    restart: unless-stopped
    init: true
    environment:
      WEB_PASSWORD: ${WEB_PASSWORD}
      API_TOKEN: ${API_TOKEN}
      BOT_URL: http://slopkeeper:8787
    ports:
      - 8080:8080 # plain HTTP: keep it on your home network or behind a proxy that adds HTTPS
    deploy:
      resources:
        limits:
          memory: 128M

  voice:
    image: ghcr.io/chuck-amuck/slopkeeper-voice:latest # text to speech, optional. Needs VOICE_URL=http://voice:5000 in .env
    restart: unless-stopped
    init: true
    volumes:
      - slopkeeper-voice:/voices
    deploy:
      resources:
        limits:
          memory: 2048M # eleven models loaded take about 1.5 GB, and a long line at the slowest speed briefly near 1.6 GB. Ones unused for 30 minutes are let go (VOICE_IDLE_MINUTES)

  loop:
    build: . # the loop bot, optional: a second bot that plays the looping room. Needs LOOP_BOT_URL=http://loop:8788 and LOOP_TOKEN in .env
    command: ["node", "--disable-warning=ExperimentalWarning", "src/loopBotMain.ts"]
    restart: unless-stopped
    init: true
    environment:
      LOOP_BOT_TOKEN: ${LOOP_BOT_TOKEN}
      LOOP_TOKEN: ${LOOP_TOKEN}
      ALLOWED_GUILD_IDS: ${ALLOWED_GUILD_IDS:-}
    volumes:
      - slopkeeper-data:/data:ro # the sounds and speech it plays, prepared by the bot
    deploy:
      resources:
        limits:
          memory: 128M

  music:
    image: ghcr.io/chuck-amuck/slopkeeper-music:latest # music from YouTube, optional. See the README's music container section
    restart: unless-stopped
    init: true
    environment:
      MUSIC_TOKEN: ${MUSIC_TOKEN}
      MUSIC_CACHE_MB: ${MUSIC_CACHE_MB:-1024}
    volumes:
      - slopkeeper-music:/data
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  slopkeeper-data:
  slopkeeper-voice:
  slopkeeper-music:
