name: Build image

on:
  push:
    branches: [main]
    # Docs-only pushes don't rebuild (a new image restarts the app at the next poll)
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    # A hung test or apt step fails here instead of running for hours
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      # The same static ffmpeg as the image, from its Dockerfile, rather than whichever apt has
      - run: |
          docker create --name ffmpeg "$(sed -n 's/^FROM \([^ ]*\) AS ffmpeg$/\1/p' Dockerfile)"
          mkdir -p "$RUNNER_TEMP/ffmpeg"
          docker cp ffmpeg:/ffmpeg "$RUNNER_TEMP/ffmpeg/"
          docker cp ffmpeg:/ffprobe "$RUNNER_TEMP/ffmpeg/"
          echo "$RUNNER_TEMP/ffmpeg" >> "$GITHUB_PATH"
        timeout-minutes: 5
      - run: ffmpeg -hide_banner -version | head -1
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  test-web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: for f in public/*.js; do node --check "$f"; done

  test-voice:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - run: python3 -m py_compile voice/*.py
      - run: sh -n voice/start.sh

  test-music:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: node --test "music/*.test.mjs"

  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha,scope=bot
          cache-to: type=gha,mode=max,scope=bot

  build-web:
    needs: test-web
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: web
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-web:latest
            ghcr.io/${{ github.repository }}-web:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  build-voice:
    needs: test-voice
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: voice
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-voice:latest
            ghcr.io/${{ github.repository }}-voice:${{ github.sha }}
          cache-from: type=gha,scope=voice
          cache-to: type=gha,mode=max,scope=voice

  build-music:
    needs: test-music
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: music
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-music:latest
            ghcr.io/${{ github.repository }}-music:${{ github.sha }}
          cache-from: type=gha,scope=music
          cache-to: type=gha,mode=max,scope=music
